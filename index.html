<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slowly Blooming Red Flower</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: linear-gradient(#101a32, #263d48 70%, #172c29);
    }

    .scene {
      position: relative;
      width: 300px;
      height: 420px;
    }

    .stem {
      position: absolute;
      left: 148px;
      top: 190px;
      width: 5px;
      height: 190px;
      border-radius: 5px;
      background: linear-gradient(90deg, #286c3a, #75bd56, #286c3a);
      transform: scaleY(0);
      transform-origin: top;
      animation: grow 4s ease-out forwards;
    }

    .leaf {
      position: absolute;
      width: 75px;
      height: 32px;
      top: 285px;
      left: 151px;
      border-radius: 100% 0 100% 0;
      background: linear-gradient(135deg, #72b84c, #24663a);
      transform: scale(0);
      transform-origin: left center;
      animation: leaf-grow 2s ease-out 2.5s forwards;
    }

    .leaf.left {
      left: 80px;
      top: 315px;
      transform: scale(0) rotate(180deg);
      transform-origin: right center;
      animation: leaf-grow-left 2s ease-out 3s forwards;
    }

    .flower {
      position: absolute;
      left: 150px;
      top: 105px;
      width: 0;
      height: 0;
      transform-origin: bottom center;
      animation: sway 5s ease-in-out 5s infinite alternate;
    }

    .petal {
      position: absolute;
      left: -26px;
      top: -78px;
      width: 52px;
      height: 88px;
      border-radius: 50% 50% 45% 45%;
      background: radial-gradient(
        ellipse at 50% 72%,
        #ff5862,
        #d4122e 65%,
        #8b071c
      );
      transform-origin: 50% 100%;
      opacity: 0;
      animation: bloom 2.8s cubic-bezier(.16, 1, .3, 1) 3.8s both;
      will-change: transform, opacity;
    }

    .petal:nth-child(1) { --angle: 0deg; }
    .petal:nth-child(2) { --angle: 45deg; animation-delay: 3.92s; }
    .petal:nth-child(3) { --angle: 90deg; animation-delay: 4.04s; }
    .petal:nth-child(4) { --angle: 135deg; animation-delay: 4.16s; }
    .petal:nth-child(5) { --angle: 180deg; animation-delay: 4.28s; }
    .petal:nth-child(6) { --angle: 225deg; animation-delay: 4.4s; }
    .petal:nth-child(7) { --angle: 270deg; animation-delay: 4.52s; }
    .petal:nth-child(8) { --angle: 315deg; animation-delay: 4.64s; }

    .center {
      position: absolute;
      z-index: 2;
      left: -20px;
      top: -20px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffd45a 15%, #e98b1c 70%);
      box-shadow: 0 0 18px #ffb832;
      transform: scale(0);
      animation: center-appear 0.9s cubic-bezier(.16, 1, .3, 1) 7.1s both;
    }

    .ground {
      position: absolute;
      left: 50%;
      bottom: 20px;
      width: 200px;
      height: 14px;
      border-radius: 50%;
      background: #10251e;
      filter: blur(5px);
      transform: translateX(-50%);
    }

    @keyframes grow {
      to { transform: scaleY(1); }
    }

    @keyframes leaf-grow {
      to { transform: scale(1); }
    }

    @keyframes leaf-grow-left {
      to { transform: scale(1) rotate(180deg); }
    }

    @keyframes bloom {
      0% {
        opacity: 0;
        transform: rotate(var(--angle)) scale(.08) translateY(18px);
      }
      72% {
        opacity: 1;
        transform: rotate(var(--angle)) scale(1.06) translateY(-2px);
      }
      100% {
        opacity: 1;
        transform: rotate(var(--angle)) scale(1) translateY(0);
      }
    }

    @keyframes center-appear {
      0% { transform: scale(0); }
      75% { transform: scale(1.12); }
      100% { transform: scale(1); }
    }

    @keyframes sway {
      from { transform: rotate(-2deg); }
      to { transform: rotate(2deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .stem,
      .leaf,
      .leaf.left,
      .petal,
      .center,
      .flower {
        animation-duration: 0.01ms;
        animation-delay: 0ms;
      }
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="stem"></div>
    <div class="leaf"></div>
    <div class="leaf left"></div>

    <div class="flower">
      <div class="petal"></div><div class="petal"></div>
      <div class="petal"></div><div class="petal"></div>
      <div class="petal"></div><div class="petal"></div>
      <div class="petal"></div><div class="petal"></div>
      <div class="center"></div>
    </div>

    <div class="ground"></div>
  </div>
</body>
</html>
